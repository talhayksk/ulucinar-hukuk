name: Static preview (GitHub Pages)

# Static preview only. The production site must be served by PocketBase
# (`scripts/pocketbase-serve.sh`) for the admin panel, forms, scheduled content
# and server-rendered article/practice/team routes. This workflow is manual on
# purpose: do not auto-deploy a static copy that cannot run PocketBase.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
