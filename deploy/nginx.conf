# ULUÇINAR Hukuk & Danışmanlık — production reverse proxy for PocketBase.
#
# Install as /etc/nginx/conf.d/ulucinar.conf (Debian/Ubuntu include this file
# inside the http{} block, which is required for limit_req_zone / limit_conn_zone).
#
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ulucinar.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before enabling:
#   1. Replace every www.ulucinar.av.tr with the real domain (placeholder).
#   2. Replace 203.0.113.10 in the admin allow-list with the office / VPN
#      egress address (RFC 5737 documentation range is used as a placeholder).
#   3. Issue the certificate (certbot --nginx -d www.ulucinar.av.tr -d ulucinar.av.tr)
#      or point ssl_certificate at your own files.
#   4. Keep PocketBase bound to 127.0.0.1:8090 (see ulucinar-pocketbase.service).
#      Nothing in this file should ever proxy to 0.0.0.0.
#
# Content-Security-Policy is generated by PocketBase (pocketbase/pb_hooks/lib/seo.js)
# and is deliberately not duplicated here: two CSP headers are intersected by
# browsers, which breaks inline styles/scripts. HSTS lives here because TLS
# terminates here and PocketBase only sends HSTS on a direct TLS connection.

# --------------------------------------------------------------------------
# Rate limiting (http context)
# --------------------------------------------------------------------------
# Admin login: a human cannot log in 10 times per minute; brute force can.
limit_req_zone $binary_remote_addr zone=ulucinar_admin:10m rate=10r/m;
# Contact form: matches the PocketBase rule (5/60s per record tag) at the edge.
limit_req_zone $binary_remote_addr zone=ulucinar_contact:10m rate=5r/m;
# Everything else under /api/ (reads by the public site).
limit_req_zone $binary_remote_addr zone=ulucinar_api:10m rate=60r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=ulucinar_perip:10m;

# Map so that websocket/realtime upgrades work without hardcoding values.
map $http_upgrade $ulucinar_connection_upgrade {
    default upgrade;
    ''      "";
}

upstream ulucinar_pocketbase {
    server 127.0.0.1:8090;
    keepalive 16;
}

# --------------------------------------------------------------------------
# HTTP -> HTTPS (ACME challenges stay on HTTP)
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.ulucinar.av.tr ulucinar.av.tr;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.ulucinar.av.tr$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS
# --------------------------------------------------------------------------
server {
    # nginx >= 1.25.1: use `listen 443 ssl;` + `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ulucinar.av.tr ulucinar.av.tr;

    ssl_certificate     /etc/letsencrypt/live/www.ulucinar.av.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ulucinar.av.tr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.ulucinar.av.tr/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ulucinar_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    root /usr/share/nginx/html;

    # Security headers. PocketBase already sends nosniff / X-Frame-Options for
    # its own responses; the values here are identical and cover TLS-only HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Five upload fields max 5 MB each, plus form overhead.
    client_max_body_size 6m;
    limit_conn ulucinar_perip 20;

    # Compression. brotli needs the optional ngx_brotli module; enable the
    # block below only when `nginx -V` lists --add-module=.../ngx_brotli.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Proxy defaults inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $ulucinar_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_hide_header X-Powered-By;

    # ---- admin panel: IP allow-list + strict rate limit -------------------
    # Never expose /_/ to the open internet. Preferred: VPN, then allow-list.
    location = /_ {
        return 301 /_/;
    }

    location ^~ /_/ {
        allow 127.0.0.1;
        allow ::1;
        allow 203.0.113.10;   # placeholder: office / VPN egress IP
        deny all;

        limit_req zone=ulucinar_admin burst=5 nodelay;
        limit_conn ulucinar_perip 10;

        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- superuser auth API: same allow-list, own bucket ------------------
    location ^~ /api/collections/_superusers {
        allow 127.0.0.1;
        allow ::1;
        allow 203.0.113.10;   # placeholder: office / VPN egress IP
        deny all;

        limit_req zone=ulucinar_admin burst=5 nodelay;
        limit_conn ulucinar_perip 10;

        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- contact form create: edge limit in front of the app rule ---------
    location = /api/collections/contact_messages/records {
        limit_req zone=ulucinar_contact burst=3 nodelay;
        limit_conn ulucinar_perip 5;

        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- realtime (SSE) used by the admin UI ------------------------------
    location = /api/realtime {
        allow 127.0.0.1;
        allow ::1;
        allow 203.0.113.10;   # placeholder: office / VPN egress IP
        deny all;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";

        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- remaining API ----------------------------------------------------
    location ^~ /api/ {
        limit_req zone=ulucinar_api burst=30 nodelay;
        proxy_buffering off;

        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- sitemap / robots: generated per request, short cache -------------
    location = /sitemap.xml {
        expires 10m;
        proxy_pass http://ulucinar_pocketbase;
    }

    location = /robots.txt {
        expires 10m;
        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- static assets: long cache (query strings do the busting) ---------
    # No add_header here on purpose: it would cancel the inherited security
    # headers listed above.
    location ~* \.(?:css|js|mjs|map|webp|avif|jpe?g|png|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        access_log off;
        proxy_pass http://ulucinar_pocketbase;
    }

    # ---- never serve dotfiles ---------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ---- everything else: pages, SSR article URLs, 404s --------------------
    location / {
        proxy_pass http://ulucinar_pocketbase;
    }
}
